spring:
  datasource:
    url: jdbc:h2:mem:innernest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

app:
  storage:
    local-path: ${java.io.tmpdir}/inner-nest-test-uploads
    public-base-url: http://localhost
  jwt:
    secret: test-secret-with-at-least-thirty-two-bytes
    ttl-minutes: 30
  cors:
    allowed-origins: http://localhost:5173
  google:
    client-id: test-google-client
  razorpay:
    key-id: test_public_key_id
    key-secret: test_payment_signature_secret
    webhook-secret: test_webhook_signature_secret
